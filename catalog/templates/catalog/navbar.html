{% load static %}
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">MyStore</h5>
    <nav class="ms-5">
        {% if request.resolver_match.namespace == 'catalog' %}
        <a class="p-2 btn btn-outline-primary" href="/catalog/home/">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="/catalog/contacts/">Контакты</a>
        {% endif %}
        {% if request.resolver_match.namespace == 'blogs' %}
        <a class="p-2 btn btn-outline-primary" href="/blog/articles/">Статьи</a>
        {% endif %}
    </nav>
</div>
